<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>K-TRONiCS ERP</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
    }

    .tagline {
      font-size: 12px;
      opacity: .75;
      margin-top: 3px;
    }

    .user {
      margin-top: 12px;
      font-size: 13px;
    }

    .content {
      padding: 15px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat {
      font-size: 28px;
      font-weight: 800;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 15px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .item {
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .item-info {
      font-size: 13px;
      color: #6b7280;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: center;
      z-index: 30;
    }

    .nav-inner {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-btn {
      background: white;
      border-radius: 0;
      padding: 12px 4px;
      color: #6b7280;
      font-size: 11px;
    }

    .nav-btn.active {
      color: #111827;
      font-weight: 800;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 75px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #111827;
      color: white;
      font-size: 28px;
      padding: 0;
      z-index: 25;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">K-TRONiCS</div>
    <div class="tagline">Empower Your Device</div>
    <div class="user" id="userInfo">Connecting...</div>
  </header>

  <main class="content">

    <!-- DASHBOARD / TODAY -->
    <section id="todayPage" class="page active">

      <div id="message"></div>

      <div class="card">
        <div class="card-title">Today's Sales</div>
        <div class="stat" id="todaySales">$0.00</div>
        <div class="muted">Total sales today</div>
      </div>

      <div class="card">
        <div class="card-title">Orders</div>
        <div class="stat" id="todayOrders">0</div>
        <div class="muted">Today's orders</div>
      </div>

      <div class="card">
        <div class="card-title">Customers</div>
        <div class="stat" id="customerCount">0</div>
        <div class="muted">Customers assigned to you</div>
      </div>

      <div class="card">
        <div class="card-title">Stock</div>
        <div class="stat" id="stockCount">0</div>
        <div class="muted">Products available</div>
      </div>

    </section>


    <!-- CUSTOMERS -->
    <section id="customersPage" class="page">

      <input
        id="customerSearch"
        class="search"
        placeholder="Search customers..."
        oninput="filterCustomers()"
      >

      <div id="customersList">
        <div class="loading">Loading customers...</div>
      </div>

    </section>


    <!-- STOCK -->
    <section id="stockPage" class="page">

      <input
        id="stockSearch"
        class="search"
        placeholder="Search products..."
        oninput="filterStock()"
      >

      <div id="stockList">
        <div class="loading">Loading stock...</div>
      </div>

    </section>


    <!-- ORDERS -->
    <section id="ordersPage" class="page">

      <input
        id="orderSearch"
        class="search"
        placeholder="Search orders..."
        oninput="filterOrders()"
      >

      <div id="ordersList">
        <div class="loading">Loading orders...</div>
      </div>

    </section>

  </main>


  <button class="fab" onclick="newRecord()">+</button>


  <nav class="bottom-nav">

    <div class="nav-inner">

      <button
        class="nav-btn active"
        onclick="showPage('todayPage', this)">
        🏠<br>Today
      </button>

      <button
        class="nav-btn"
        onclick="showPage('customersPage', this)">
        👥<br>Customers
      </button>

      <button
        class="nav-btn"
        onclick="showPage('stockPage', this)">
        📦<br>Stock
      </button>

      <button
        class="nav-btn"
        onclick="showPage('ordersPage', this)">
        🧾<br>Orders
      </button>

    </div>

  </nav>

</div>


<script>

  /*
   * ============================================================
   * K-TRONiCS TELEGRAM MINI APP
   * ============================================================
   *
   * IMPORTANT:
   * Replace the URL below with your deployed
   * Google Apps Script Web App URL.
   *
   * Example:
   * https://script.google.com/macros/s/XXXXXXXX/exec
   */

  const API_URL =
    'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';


  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  let currentUser = null;
  let customers = [];
  let inventory = [];
  let orders = [];


  /*
   * ------------------------------------------------------------
   * API
   * ------------------------------------------------------------
   */

  async function api(action, extra = {}) {

    if (
      !API_URL ||
      API_URL.includes('PASTE_YOUR')
    ) {
      throw new Error(
        'Please configure your Google Apps Script Web App URL.'
      );
    }

    const body = {
      action: action,
      initData: tg.initData,
      ...extra
    };

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type':
          'text/plain;charset=utf-8'
      },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      throw new Error(
        'Server error: HTTP ' + response.status
      );
    }

    const data = await response.json();

    if (data.success === false) {
      throw new Error(
        data.error || 'Request failed'
      );
    }

    return data;
  }


  /*
   * ------------------------------------------------------------
   * INITIALIZE
   * ------------------------------------------------------------
   */

  async function initialize() {

    try {

      if (!tg.initData) {
        showError(
          'Please open this application from Telegram.'
        );
        return;
      }

      const result =
        await api('whoAmI');

      currentUser =
        result.user || result;

      displayUser();

      await Promise.all([
        loadCustomers(),
        loadInventory(),
        loadOrders(),
        loadDailyReport()
      ]);

    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        'Unable to connect to K-TRONiCS ERP.'
      );
    }
  }


  /*
   * ------------------------------------------------------------
   * USER
   * ------------------------------------------------------------
   */

  function displayUser() {

    if (!currentUser) return;

    const name =
      currentUser.name ||
      currentUser.fullName ||
      currentUser.Sales_Rep_Name ||
      currentUser.email ||
      'User';

    document.getElementById('userInfo')
      .textContent =
      '👤 ' + name;
  }


  /*
   * ------------------------------------------------------------
   * CUSTOMERS
   * ------------------------------------------------------------
   */

  async function loadCustomers() {

    const result =
      await api('getCustomers');

    customers =
      result.customers ||
      result.data ||
      [];

    renderCustomers();

    document.getElementById(
      'customerCount'
    ).textContent =
      customers.length;
  }


  function renderCustomers(list = customers) {

    const container =
      document.getElementById(
        'customersList'
      );

    if (!list.length) {

      container.innerHTML =
        '<div class="card">' +
        'No customers found.' +
        '</div>';

      return;
    }

    container.innerHTML =
      list.map(customer => {

        const name =
          customer.Customer_Name ||
          customer.customerName ||
          'Unnamed Customer';

        const phone =
          customer.Contact_No ||
          customer.phone ||
          '';

        const location =
          customer.Location ||
          customer.location ||
          '';

        return `
          <div class="card item">

            <div class="item-name">
              ${escapeHtml(name)}
            </div>

            <div class="item-info">
              ${escapeHtml(phone)}
            </div>

            <div class="item-info">
              ${escapeHtml(location)}
            </div>

          </div>
        `;

      }).join('');
  }


  function filterCustomers() {

    const q =
      document.getElementById(
        'customerSearch'
      ).value
      .toLowerCase();

    const filtered =
      customers.filter(c => {

        const text =
          JSON.stringify(c)
            .toLowerCase();

        return text.includes(q);
      });

    renderCustomers(filtered);
  }


  /*
   * ------------------------------------------------------------
   * INVENTORY
   * ------------------------------------------------------------
   */

  async function loadInventory() {

    const result =
      await api('getInventory');

    inventory =
      result.inventory ||
      result.data ||
      [];

    renderInventory();

    document.getElementById(
      'stockCount'
    ).textContent =
      inventory.length;
  }


  function renderInventory(list = inventory) {

    const container =
      document.getElementById(
        'stockList'
      );

    if (!list.length) {

      container.innerHTML =
        '<div class="card">' +
        'No inventory found.' +
        '</div>';

      return;
    }

    container.innerHTML =
      list.map(product => {

        const sku =
          product.SKU || '';

        const name =
          product.Product_Name ||
          product.Products_Name ||
          'Product';

        const stock =
          product.Total_Available_Stock ??
          product.Main_Stock ??
          0;

        const category =
          product.Category || '';

        let status =
          'Available';

        if (Number(stock) <= 0) {
          status = 'Out of stock';
        } else if (
          Number(stock) <=
          Number(product.Reorder_Level || 0)
        ) {
          status = 'Low stock';
        }

        return `
          <div class="card item">

            <div class="item-name">
              ${escapeHtml(name)}
            </div>

            <div class="item-info">
              SKU: ${escapeHtml(sku)}
            </div>

            <div class="item-info">
              Category:
              ${escapeHtml(category)}
            </div>

            <div class="item-info">
              Stock: <strong>${stock}</strong>
              · ${status}
            </div>

          </div>
        `;

      }).join('');
  }


  function filterStock() {

    const q =
      document.getElementById(
        'stockSearch'
      ).value
      .toLowerCase();

    const filtered =
      inventory.filter(p => {

        return JSON.stringify(p)
          .toLowerCase()
          .includes(q);

      });

    renderInventory(filtered);
  }


  /*
   * ------------------------------------------------------------
   * ORDERS
   * ------------------------------------------------------------
   */

  async function loadOrders() {

    const result =
      await api('getSalesOrders');

    orders =
      result.orders ||
      result.data ||
      [];

    renderOrders();
  }


  function renderOrders(list = orders) {

    const container =
      document.getElementById(
        'ordersList'
      );

    if (!list.length) {

      container.innerHTML =
        '<div class="card">' +
        'No orders found.' +
        '</div>';

      return;
    }

    container.innerHTML =
      list.map(order => {

        const number =
          order.SO_Number ||
          order.soNumber ||
          '';

        const customer =
          order.Customer_Name ||
          '';

        const amount =
          order.Total_Amount ??
          0;

        const payment =
          order.Payment_Status ||
          '';

        const status =
          order.Order_Status ||
          '';

        return `
          <div class="card item">

            <div class="item-name">
              ${escapeHtml(number)}
            </div>

            <div class="item-info">
              Customer:
              ${escapeHtml(customer)}
            </div>

            <div class="item-info">
              Amount:
              ${formatMoney(amount)}
            </div>

            <div class="item-info">
              Payment:
              ${escapeHtml(payment)}
            </div>

            <div class="item-info">
              Status:
              ${escapeHtml(status)}
            </div>

          </div>
        `;

      }).join('');
  }


  function filterOrders() {

    const q =
      document.getElementById(
        'orderSearch'
      ).value
      .toLowerCase();

    const filtered =
      orders.filter(o => {

        return JSON.stringify(o)
          .toLowerCase()
          .includes(q);

      });

    renderOrders(filtered);
  }


  /*
   * ------------------------------------------------------------
   * DAILY REPORT
   * ------------------------------------------------------------
   */

  async function loadDailyReport() {

    try {

      const result =
        await api('getDailyReport');

      const report =
        result.report ||
        result.data ||
        result;

      document.getElementById(
        'todaySales'
      ).textContent =
        formatMoney(
          report.totalSales ||
          report.Total_Sales ||
          0
        );

      document.getElementById(
        'todayOrders'
      ).textContent =
        report.totalOrders ||
        report.Total_Orders ||
        0;

    } catch (error) {

      console.warn(
        'Daily report:',
        error
      );
    }
  }


  /*
   * ------------------------------------------------------------
   * NAVIGATION
   * ------------------------------------------------------------
   */

  function showPage(pageId, button) {

    document
      .querySelectorAll('.page')
      .forEach(page => {
        page.classList.remove('active');
      });

    document
      .getElementById(pageId)
      .classList.add('active');

    document
      .querySelectorAll('.nav-btn')
      .forEach(btn => {
        btn.classList.remove('active');
      });

    button.classList.add('active');

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }


  /*
   * ------------------------------------------------------------
   * NEW RECORD
   * ------------------------------------------------------------
   */

  function newRecord() {

    const active =
      document.querySelector(
        '.page.active'
      );

    if (!active) return;

    if (
      active.id ===
      'customersPage'
    ) {

      alert(
        'Customer creation form will be connected to saveCustomer.'
      );

    } else if (
      active.id ===
      'ordersPage'
    ) {

      alert(
        'Sales order creation form will be connected to saveSalesOrder.'
      );

    } else {

      alert(
        'Select Customers or Orders first.'
      );
    }
  }


  /*
   * ------------------------------------------------------------
   * HELPERS
   * ------------------------------------------------------------
   */

  function formatMoney(value) {

    const number =
      Number(value) || 0;

    return number.toLocaleString(
      'en-US',
      {
        style: 'currency',
        currency: 'USD'
      }
    );
  }


  function escapeHtml(value) {

    return String(
      value ?? ''
    )
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }


  function showError(message) {

    document.getElementById(
      'message'
    ).innerHTML = `
      <div class="error">
        ${escapeHtml(message)}
      </div>
    `;
  }


  /*
   * ------------------------------------------------------------
   * START
   * ------------------------------------------------------------
   */

  initialize();

</script>

</body>
</html>
